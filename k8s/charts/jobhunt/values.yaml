# 这是唯一「给使用者改」的文件，templates/ 里的是实现细节。

# 数据在外部 MySQL 上，Pod 本身没有状态，调大是安全的。
# 保持 1 只是因为这是一个人用的看板，一个 Pod 绰绰有余。
replicaCount: 1

image:
  # 公开的 GHCR 镜像，不需要 imagePullSecret。
  # 仓库开源之后镜像也是公开的 —— 这正是不用 ECR 的原因：
  # 省掉了「12 小时过期的登录 token 要靠 CronJob 定期刷新」那一整套东西。
  repository: ghcr.io/xiantang/jobhunt-board
  # 留空 → 回退到 Chart.yaml 的 appVersion（不可变的 sha-<commit>）。
  # 发布请改 Chart.yaml,不要在这写死 —— 否则回滚时两个地方对不上。
  tag: ""
  # tag 不可变，没必要每次回源确认
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# 容器实际监听的端口（Dockerfile 里 CMD 的 -addr :8080）
containerPort: 8080

ingress:
  enabled: true
  className: traefik
  host: jobhunt.vim0.com
  annotations:
    # 证书由 cert-manager 签，走 Cloudflare DNS-01(集群里已有这个 ClusterIssuer,
    # 博客在用同一个)。
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    # 留空则自动生成 <release-name>-tls
    secretName: ""

# ── 访问控制 ────────────────────────────────────────────────────────
#
# 这个看板没有任何登录功能，里面是真实的投递记录、面试时间、面试官姓名。
# 公网 HTTPS 一暴露，任何知道地址的人都能读写。所以在 Ingress 前面挂一层
# Traefik 的 BasicAuth 中间件。
#
# 口令【不在 git 里】,要手动在集群里建 Secret,见 k8s/README.md。
basicAuth:
  enabled: true
  # 存 htpasswd 内容的 Secret 名字
  secretName: jobhunt-basicauth
  # ⚠️ Traefik 的 CRD 组名换过：v2 早期是 traefik.containo.us,v3 是 traefik.io。
  #    k3s 自带的 Traefik 版本决定该用哪个。查一下再改：
  #      k get crd | grep middlewares
  apiVersion: traefik.io/v1alpha1

# ── 应用密钥 ────────────────────────────────────────────────────────
#
# OPENAI_API_KEY / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URL
# 都从这个 Secret 注入，同样【不在 git 里】,手动创建。
#
# optional: true —— Secret 不存在时 Pod 照常启动，只是 AI 录入和日历同步
# 两个功能不显示入口（应用本来就是这么设计的）。这样「密钥还没配」不会
# 表现成 Pod 起不来。
secretName: jobhunt-secrets

# ── 数据库 ──────────────────────────────────────────────────────────
#
# 线上跑 MySQL,连接串从下面这个 Secret 的 dsn 键注入成 MYSQL_DSN。
# 本地开发不配这个环境变量，应用会退回 SQLite 文件（见 cmd/server/main.go）。
#
# 这个 Secret【不在 git 里】,要手动建，见 k8s/README.md：
#   kubectl create secret generic jobhunt-mysql \
#     --from-literal=dsn='user:pass@tcp(mysql.internal:3306)/jobhunt'
#
# 它【不是】optional 的：Secret 不存在时 Pod 起不来。这是故意的 ——
# 要是让它可选，缺 DSN 的 Pod 会安静地退回 SQLite,把数据写进容器的临时
# 文件系统，重启就没，而且一切看起来都正常。宁可起不来。
mysql:
  secretName: jobhunt-mysql
  secretKey: dsn

  # 集群里自带的那个 MySQL 实例（StatefulSet + PVC + ClusterIP Service）。
  #
  # 它和上面的 secretName 是两件事：这里配的是【怎么把库跑起来】，
  # 上面配的是【应用拿什么连接串去连】。两个 Secret 也分开：
  #   jobhunt-mysql-auth  给 MySQL 自己 —— root 口令、应用账号和口令
  #   jobhunt-mysql       给应用 —— 一整条 DSN
  # 分开是因为泄露面不同：应用只该知道自己那条 DSN,不该拿到 root。
  #
  # enabled: false 就是回到「连外部实例」，只留上面那条 DSN。
  internal:
    enabled: true
    image: mysql:8.4
    database: jobhunt
    secretName: jobhunt-mysql-auth
    # 留空用集群默认 StorageClass。k3s 默认是 local-path
    # —— 数据落在【那台节点】的本地磁盘，不是备份，见 k8s/README.md。
    storageClass: ""
    size: 5Gi
    # 这台机器还跑着 k3s 和博客，别让 InnoDB 把内存吃光。
    bufferPoolSize: 128M
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        # MySQL 超内存会被 OOMKill,而不是像 CPU 那样降速，
        # 所以这个上限要留够余量：缓冲池 128M + 连接和线程的开销。
        memory: 768Mi

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    # 没有 cpu limit 是故意的：CPU 是可压缩资源，超了会被限流而不是被杀。
    # 设了 limit 反而容易在冷启动/编译模板时被无谓地掐住。
    memory: 256Mi

# 健康检查路径，应用里有现成的 /healthz
probePath: /healthz
