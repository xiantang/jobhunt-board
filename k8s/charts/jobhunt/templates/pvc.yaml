{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "jobhunt.fullname" . }}-data
  labels:
    {{- include "jobhunt.labels" . | nindent 4 }}
  annotations:
    # ⚠️ 让 ArgoCD 在 prune 时【不要】删这个 PVC。
    #
    # 默认行为下，如果哪天这个 chart 从 Application 里移除、或者渲染时
    # persistence.enabled 变成 false,ArgoCD 会连 PVC 一起删掉 ——
    # local-path 的 reclaimPolicy 是 Delete,PVC 一没，节点上那个目录
    # 跟着被清空，所有投递记录当场蒸发，而且没有任何确认步骤。
    #
    # 加上这个之后，PVC 变成需要手动删除的资源。这正是想要的：
    # 有状态的东西不该被自动化顺手带走。
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
