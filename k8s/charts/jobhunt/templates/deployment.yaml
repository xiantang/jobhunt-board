apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jobhunt.fullname" . }}
  labels:
    {{- include "jobhunt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  # 数据搬到外部 MySQL 之后，两个 Pod 短暂共存不再有「同时写一个文件」
  # 的问题，滚动更新是安全的，发布也就不用停机了。
  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      {{- include "jobhunt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobhunt.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        # 镜像里已经 USER nonroot,这里再声明一次是让 kubelet 在启动【前】
        # 就拒绝以 root 运行的镜像 —— 万一哪天 Dockerfile 的 USER 被删掉，
        # 会立刻失败而不是悄悄以 root 跑起来。
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: jobhunt
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -addr
            - ":{{ .Values.containerPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}

          # 数据库连接串。没有它就没有线上数据，所以【不是】 optional:
          # Secret 缺失时 Pod 停在 CreateContainerConfigError,而不是
          # 悄悄退回容器内的 SQLite 文件。
          env:
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.secretName }}
                  key: {{ .Values.mysql.secretKey }}

          # 其余密钥。optional: true 让「还没建这个 Secret」不至于挡住启动 ——
          # 应用本来就支持不配密钥运行（少两个功能入口）。
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
                optional: true

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # 根文件系统只读。镜像是 distroless（没有 shell、没有包管理器）,
            # 再加上只读根，攻击者即使拿到执行权也没地方落文件。
            # 唯一需要写的地方是 /tmp（下面挂了 emptyDir）。
            readOnlyRootFilesystem: true

          volumeMounts:
            # Go 运行时和 TLS 握手偶尔要落临时文件，根文件系统只读，
            # 得给它一个可写的 /tmp。
            - name: tmp
              mountPath: /tmp

          readinessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: tmp
          emptyDir: {}
